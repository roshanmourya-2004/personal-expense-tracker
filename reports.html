<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reports - Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="dashboard.html"><i class="fa-solid fa-wallet text-warning me-2"></i>ExpenseTracker</a>
        <div class="d-flex align-items-center">
            <span class="text-white me-3" id="userGreeting"></span>
            <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Logout</button>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-3 col-lg-2 sidebar collapse d-md-block p-0">
            <ul class="nav flex-column pt-3">
                <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fa-solid fa-chart-line me-2"></i> Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="transactions.html"><i class="fa-solid fa-list-check me-2"></i> Transactions</a></li>
                <li class="nav-item"><a class="nav-link active" href="reports.html"><i class="fa-solid fa-file-invoice-dollar me-2"></i> Reports</a></li>
            </ul>
        </div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <h2 class="fw-bold mb-4">Monthly Financial Reports</h2>

            <!-- Month Filter -->
            <div class="card border-0 shadow-sm p-3 mb-4">
                <div class="row align-items-center">
                    <label class="col-auto col-form-label fw-bold">Select Month:</label>
                    <div class="col-auto">
                        <select id="monthSelect" class="form-select"></select>
                    </div>
                </div>
            </div>

            <!-- Summary Cards -->
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <div class="card border-0 shadow-sm p-3">
                        <span class="text-muted">Monthly Income</span>
                        <h3 class="text-success fw-bold mt-1" id="lblMonthlyIncome">₹0.00</h3>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card border-0 shadow-sm p-3">
                        <span class="text-muted">Monthly Expense</span>
                        <h3 class="text-danger fw-bold mt-1" id="lblMonthlyExpense">₹0.00</h3>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card border-0 shadow-sm p-3">
                        <span class="text-muted">Net Savings</span>
                        <h3 class="text-primary fw-bold mt-1" id="lblMonthlySavings">₹0.00</h3>
                    </div>
                </div>
            </div>

            <!-- Category Breakdown Table -->
            <div class="card border-0 shadow-sm p-4">
                <h5 class="fw-bold mb-3">Category Expense Breakdown</h5>
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th>Category</th>
                                <th>Total Spent</th>
                                <th style="width: 50%;">Percentage of Expense</th>
                            </tr>
                        </thead>
                        <tbody id="categoryReportBody">
                            <tr><td colspan="3" class="text-center text-muted">Loading reports from cloud...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
    import { 
        auth, 
        db, 
        onAuthStateChanged, 
        signOut, 
        collection, 
        getDocs, 
        query, 
        where 
    } from "./js/firebase-config.js";

    let currentUser = null;
    let allTransactions = [];

    // Auth State Observer
    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            window.location.href = 'login.html';
        } else {
            currentUser = user;
            document.getElementById('userGreeting').innerText = `Welcome, ${user.displayName || user.email.split('@')[0]}`;
            await loadFirestoreData();
        }
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
        await signOut(auth);
        window.location.href = 'login.html';
    });

    // Fetch user transactions from Cloud Firestore
    async function loadFirestoreData() {
        try {
            const q = query(collection(db, "transactions"), where("userId", "==", currentUser.uid));
            const snapshot = await getDocs(q);
            allTransactions = [];

            snapshot.forEach(docSnap => {
                allTransactions.push({ id: docSnap.id, ...docSnap.data() });
            });

            setupMonthSelector();
            generateReport();
        } catch (error) {
            console.error("Error loading reports:", error);
            document.getElementById('categoryReportBody').innerHTML = `<tr><td colspan="3" class="text-center text-danger">Error: ${error.message}</td></tr>`;
        }
    }

    // Populate dropdown with available months from transactions
    function setupMonthSelector() {
        const select = document.getElementById('monthSelect');
        const monthsSet = new Set();

        allTransactions.forEach(t => {
            if (t.date) {
                const ym = t.date.substring(0, 7); // "YYYY-MM"
                monthsSet.add(ym);
            }
        });

        // Add current month if empty
        const currentYM = new Date().toISOString().substring(0, 7);
        monthsSet.add(currentYM);

        const sortedMonths = Array.from(monthsSet).sort().reverse();
        select.innerHTML = sortedMonths.map(ym => {
            const [y, m] = ym.split('-');
            const dateObj = new Date(parseInt(y), parseInt(m) - 1, 1);
            const label = dateObj.toLocaleString('en-US', { month: 'long', year: 'numeric' });
            return `<option value="${ym}">${label}</option>`;
        }).join('');

        select.addEventListener('change', generateReport);
    }

    // Calculate totals and render table
    function generateReport() {
        const selectedYM = document.getElementById('monthSelect').value;
        const filtered = allTransactions.filter(t => t.date && t.date.startsWith(selectedYM));

        let monthlyIncome = 0;
        let monthlyExpense = 0;
        const catMap = {};

        filtered.forEach(t => {
            const amt = parseFloat(t.amount) || 0;
            if (t.type === 'Income') {
                monthlyIncome += amt;
            } else if (t.type === 'Expense') {
                monthlyExpense += amt;
                catMap[t.category] = (catMap[t.category] || 0) + amt;
            }
        });

        const netSavings = monthlyIncome - monthlyExpense;

        // Update cards
        document.getElementById('lblMonthlyIncome').innerText = `₹${monthlyIncome.toFixed(2)}`;
        document.getElementById('lblMonthlyExpense').innerText = `₹${monthlyExpense.toFixed(2)}`;
        document.getElementById('lblMonthlySavings').innerText = `₹${netSavings.toFixed(2)}`;

        // Render category breakdown rows
        const tbody = document.getElementById('categoryReportBody');
        const categories = Object.keys(catMap);

        if (categories.length === 0) {
            tbody.innerHTML = `<tr><td colspan="3" class="text-center text-muted">No expense records found for this month.</td></tr>`;
            return;
        }

        tbody.innerHTML = categories.map(cat => {
            const total = catMap[cat];
            const pct = monthlyExpense > 0 ? ((total / monthlyExpense) * 100).toFixed(1) : 0;
            return `
                <tr>
                    <td class="fw-semibold">${cat}</td>
                    <td class="text-danger fw-bold">₹${total.toFixed(2)}</td>
                    <td>
                        <div class="d-flex align-items-center">
                            <div class="progress flex-grow-1 me-2" style="height: 10px;">
                                <div class="progress-bar bg-danger" role="progressbar" style="width: ${pct}%"></div>
                            </div>
                            <span class="small text-muted">${pct}%</span>
                        </div>
                    </td>
                </tr>
            `;
        }).join('');
    }
</script>
</body>
</html>
