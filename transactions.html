<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Transactions - Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="dashboard.html"><i class="fa-solid fa-wallet text-warning me-2"></i>ExpenseTracker</a>
        <button onclick="logoutUser()" class="btn btn-outline-danger btn-sm">Logout</button>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-3 col-lg-2 sidebar collapse d-md-block p-0">
            <ul class="nav flex-column pt-3">
                <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fa-solid fa-chart-line me-2"></i> Dashboard</a></li>
                <li class="nav-item"><a class="nav-link active" href="transactions.html"><i class="fa-solid fa-list-check me-2"></i> Transactions</a></li>
                <li class="nav-item"><a class="nav-link" href="reports.html"><i class="fa-solid fa-file-invoice-dollar me-2"></i> Reports</a></li>
            </ul>
        </div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold">Manage Transactions</h2>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#txModal" onclick="clearForm()"><i class="fa-solid fa-plus me-1"></i> Add Transaction</button>
            </div>

            <!-- Filters -->
            <div class="card border-0 shadow-sm p-3 mb-4">
                <div class="row g-2">
                    <div class="col-md-4">
                        <input type="text" id="searchFilter" class="form-control" placeholder="Search description..." onkeyup="filterTable()">
                    </div>
                    <div class="col-md-4">
                        <select id="typeFilter" class="form-select" onchange="filterTable()">
                            <option value="">All Types</option>
                            <option value="Income">Income</option>
                            <option value="Expense">Expense</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Table -->
            <div class="card border-0 shadow-sm p-3">
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                            <tr><th>Date</th><th>Type</th><th>Category</th><th>Description</th><th>Amount</th><th>Actions</th></tr>
                        </thead>
                        <tbody id="txTableBody"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Modal Form -->
<div class="modal fade" id="txModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Add Transaction</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="txForm">
                <div class="modal-body">
                    <input type="hidden" id="editId">
                    <div class="mb-3">
                        <label class="form-label">Type</label>
                        <select id="txType" class="form-select" onchange="populateCategoryDropdown()" required>
                            <option value="Income">Income</option>
                            <option value="Expense" selected>Expense</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <select id="txCategory" class="form-select" required></select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Amount (₹)</label>
                        <input type="number" step="0.01" id="txAmount" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Date</label>
                        <input type="date" id="txDate" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <input type="text" id="txDesc" class="form-control">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">Save Transaction</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
    checkAuth();

    function populateCategoryDropdown() {
        const type = document.getElementById('txType').value;
        const categories = getCategories().filter(c => c.type === type);
        document.getElementById('txCategory').innerHTML = categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    }

    function renderTable(data) {
        const tbody = document.getElementById('txTableBody');
        if(data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted">No transactions recorded.</td></tr>`;
            return;
        }
        tbody.innerHTML = data.map(t => `
            <tr>
                <td>${t.date}</td>
                <td><span class="badge bg-${t.type === 'Income' ? 'success' : 'danger'}">${t.type}</span></td>
                <td>${t.categoryName}</td>
                <td>${t.description || '-'}</td>
                <td class="fw-bold ${t.type === 'Income' ? 'text-success' : 'text-danger'}">₹${t.amount.toFixed(2)}</td>
                <td>
                    <button class="btn btn-sm btn-outline-danger" onclick="handleDelete(${t.id})"><i class="fa-solid fa-trash"></i></button>
                </td>
            </tr>
        `).join('');
    }

    function filterTable() {
        const search = document.getElementById('searchFilter').value.toLowerCase();
        const type = document.getElementById('typeFilter').value;
        let txs = getUserTransactions();

        if (search) txs = txs.filter(t => (t.description || '').toLowerCase().includes(search));
        if (type) txs = txs.filter(t => t.type === type);

        renderTable(txs.reverse());
    }

    function handleDelete(id) {
        if(confirm('Are you sure you want to delete this transaction?')) {
            deleteTransaction(id);
            filterTable();
        }
    }

    function clearForm() {
        document.getElementById('txForm').reset();
        document.getElementById('txDate').value = new Date().toISOString().split('T')[0];
        populateCategoryDropdown();
    }

    document.getElementById('txForm').addEventListener('submit', function(e) {
        e.preventDefault();
        addTransaction(
            document.getElementById('txType').value,
            document.getElementById('txCategory').value,
            document.getElementById('txAmount').value,
            document.getElementById('txDesc').value,
            document.getElementById('txDate').value
        );
        bootstrap.Modal.getInstance(document.getElementById('txModal')).hide();
        filterTable();
    });

    populateCategoryDropdown();
    filterTable();
</script>
</body>
</html>
