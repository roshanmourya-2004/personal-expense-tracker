<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Transactions - Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="dashboard.html"><i class="fa-solid fa-wallet text-warning me-2"></i>ExpenseTracker</a>
        <button onclick="handleLogout()" class="btn btn-outline-danger btn-sm">Logout</button>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-3 col-lg-2 sidebar collapse d-md-block p-0">
            <ul class="nav flex-column pt-3">
                <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fa-solid fa-chart-line me-2"></i> Dashboard</a></li>
                <li class="nav-item"><a class="nav-link active" href="transactions.html"><i class="fa-solid fa-list-check me-2"></i> Transactions</a></li>
                <li class="nav-item"><a class="nav-link" href="reports.html"><i class="fa-solid fa-file-invoice-dollar me-2"></i> Reports</a></li>
            </ul>
        </div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold">Manage Transactions</h2>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#txModal"><i class="fa-solid fa-plus me-1"></i> Add Transaction</button>
            </div>

            <!-- Filters -->
            <div class="card border-0 shadow-sm p-3 mb-4">
                <div class="row g-2">
                    <div class="col-md-4">
                        <input type="text" id="searchFilter" class="form-control" placeholder="Search description...">
                    </div>
                    <div class="col-md-4">
                        <select id="typeFilter" class="form-select">
                            <option value="">All Types</option>
                            <option value="Income">Income</option>
                            <option value="Expense">Expense</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Table -->
            <div class="card border-0 shadow-sm p-3">
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                            <tr><th>Date</th><th>Type</th><th>Category</th><th>Description</th><th>Amount</th><th>Actions</th></tr>
                        </thead>
                        <tbody id="txTableBody">
                            <tr><td colspan="6" class="text-center text-muted">Loading transactions from cloud...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Modal Form -->
<div class="modal fade" id="txModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Add Transaction</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="txForm">
                <div class="modal-body">
                    <div id="modalAlert"></div>
                    <div class="mb-3">
                        <label class="form-label">Type</label>
                        <select id="txType" class="form-select" required>
                            <option value="Income">Income</option>
                            <option value="Expense" selected>Expense</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <select id="txCategory" class="form-select" required></select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Amount (₹)</label>
                        <input type="number" step="0.01" id="txAmount" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Date</label>
                        <input type="date" id="txDate" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <input type="text" id="txDesc" class="form-control">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" id="saveBtn" class="btn btn-primary">Save Transaction</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
    import { 
        auth, 
        db, 
        onAuthStateChanged, 
        signOut, 
        collection, 
        addDoc, 
        getDocs, 
        deleteDoc, 
        doc, 
        query, 
        where 
    } from "./js/firebase-config.js";

    let currentUser = null;
    let transactionsList = [];

    const categoriesData = [
        { id: 1, name: 'Salary', type: 'Income' },
        { id: 2, name: 'Freelance', type: 'Income' },
        { id: 3, name: 'Investment', type: 'Income' },
        { id: 4, name: 'Food', type: 'Expense' },
        { id: 5, name: 'Travel', type: 'Expense' },
        { id: 6, name: 'Rent', type: 'Expense' },
        { id: 7, name: 'Entertainment', type: 'Expense' },
        { id: 8, name: 'Medical', type: 'Expense' }
    ];

    // Auth State Observer
    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            window.location.href = 'login.html';
        } else {
            currentUser = user;
            populateCategoryDropdown();
            // Set default date to today
            document.getElementById('txDate').value = new Date().toISOString().split('T')[0];
            await loadTransactions();
        }
    });

    // Logout
    window.handleLogout = async function() {
        await signOut(auth);
        window.location.href = 'login.html';
    };

    function populateCategoryDropdown() {
        const type = document.getElementById('txType').value;
        const cats = categoriesData.filter(c => c.type === type);
        document.getElementById('txCategory').innerHTML = cats.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
    }
    document.getElementById('txType').addEventListener('change', populateCategoryDropdown);

    // Fetch from Firestore
    async function loadTransactions() {
        if (!currentUser) return;
        try {
            const q = query(collection(db, "transactions"), where("userId", "==", currentUser.uid));
            const querySnapshot = await getDocs(q);
            transactionsList = [];
            querySnapshot.forEach((docSnapshot) => {
                transactionsList.push({ id: docSnapshot.id, ...docSnapshot.data() });
            });
            transactionsList.sort((a, b) => new Date(b.date) - new Date(a.date));
            renderTable(transactionsList);
        } catch (error) {
            console.error("Error reading Firestore:", error);
            document.getElementById('txTableBody').innerHTML = `<tr><td colspan="6" class="text-center text-danger">Error: ${error.message}</td></tr>`;
        }
    }

    function renderTable(data) {
        const tbody = document.getElementById('txTableBody');
        if (data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted">No transactions found in cloud database.</td></tr>`;
            return;
        }
        tbody.innerHTML = data.map(t => `
            <tr>
                <td>${t.date}</td>
                <td><span class="badge bg-${t.type === 'Income' ? 'success' : 'danger'}">${t.type}</span></td>
                <td>${t.category}</td>
                <td>${t.description || '-'}</td>
                <td class="fw-bold ${t.type === 'Income' ? 'text-success' : 'text-danger'}">₹${parseFloat(t.amount).toFixed(2)}</td>
                <td>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteTx('${t.id}')">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </td>
            </tr>
        `).join('');
    }

    // Save Transaction Form Handler
    document.getElementById('txForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const saveBtn = document.getElementById('saveBtn');
        const alertBox = document.getElementById('modalAlert');
        alertBox.innerHTML = '';

        const type = document.getElementById('txType').value;
        const category = document.getElementById('txCategory').value;
        const amount = parseFloat(document.getElementById('txAmount').value);
        const date = document.getElementById('txDate').value;
        const description = document.getElementById('txDesc').value.trim();

        if (isNaN(amount) || amount <= 0) {
            alertBox.innerHTML = `<div class="alert alert-danger p-2">Please enter a valid amount greater than 0.</div>`;
            return;
        }

        try {
            saveBtn.disabled = true;
            saveBtn.innerText = "Saving to Cloud...";

            await addDoc(collection(db, "transactions"), {
                userId: currentUser.uid,
                type: type,
                category: category,
                amount: amount,
                date: date,
                description: description,
                createdAt: new Date().toISOString()
            });

            // Safe Bootstrap Modal dismissal
            const modalEl = document.getElementById('txModal');
            const modalInstance = bootstrap.Modal.getOrCreateInstance(modalEl);
            modalInstance.hide();

            document.getElementById('txForm').reset();
            document.getElementById('txDate').value = new Date().toISOString().split('T')[0];
            populateCategoryDropdown();
            
            await loadTransactions();
        } catch (error) {
            console.error("Firestore Save Error:", error);
            alertBox.innerHTML = `<div class="alert alert-danger p-2">${error.message}</div>`;
        } finally {
            saveBtn.disabled = false;
            saveBtn.innerText = "Save Transaction";
        }
    });

    // Delete Transaction
    window.deleteTx = async function(docId) {
        if (confirm("Delete this transaction from Cloud Firestore?")) {
            try {
                await deleteDoc(doc(db, "transactions", docId));
                await loadTransactions();
            } catch (err) {
                alert("Failed to delete: " + err.message);
            }
        }
    };

    // Table Filters
    function applyFilters() {
        const search = document.getElementById('searchFilter').value.toLowerCase();
        const type = document.getElementById('typeFilter').value;
        let filtered = transactionsList;

        if (search) filtered = filtered.filter(t => (t.description || '').toLowerCase().includes(search));
        if (type) filtered = filtered.filter(t => t.type === type);

        renderTable(filtered);
    }
    document.getElementById('searchFilter').addEventListener('input', applyFilters);
    document.getElementById('typeFilter').addEventListener('change', applyFilters);
</script>
</body>
</html>
