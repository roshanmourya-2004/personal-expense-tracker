<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4">Register</h3>
                    <div id="alertBox"></div>
                    <form id="registerForm">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" id="name" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" id="email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" id="password" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" id="confirmPassword" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Create Account</button>
                    </form>
                    <div class="text-center mt-3">
                        Already have an account? <a href="login.html">Login here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="js/auth.js"></script>
<script type="module">
    import { auth, createUserWithEmailAndPassword, updateProfile } from "./js/firebase-config.js";

    const regForm = document.getElementById('registerForm');
    const alertBox = document.getElementById('alertBox');

    regForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        alertBox.innerHTML = '';

        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const pass = document.getElementById('password').value;
        const confirmPass = document.getElementById('confirmPassword').value;

        if (pass !== confirmPass) {
            alertBox.innerHTML = `<div class="alert alert-danger">Passwords do not match.</div>`;
            return;
        }

        try {
            // Register user in Firebase Authentication
            const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
            // Save user's display name
            await updateProfile(userCredential.user, { displayName: name });
            
            alertBox.innerHTML = `<div class="alert alert-success">Account created in Cloud! <a href="login.html">Login here</a></div>`;
            regForm.reset();
        } catch (error) {
            alertBox.innerHTML = `<div class="alert alert-danger">${error.message}</div>`;
        }
    });
</script>
</body>
</html>
