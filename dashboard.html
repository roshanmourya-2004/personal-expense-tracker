<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="dashboard.html"><i class="fa-solid fa-wallet text-warning me-2"></i>ExpenseTracker</a>
        <div class="d-flex align-items-center">
            <span class="text-light me-3" id="welcomeUser"></span>
            <button onclick="logoutUser()" class="btn btn-outline-danger btn-sm">Logout</button>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar Navigation -->
        <div class="col-md-3 col-lg-2 sidebar collapse d-md-block p-0">
            <ul class="nav flex-column pt-3">
                <li class="nav-item"><a class="nav-link active" href="dashboard.html"><i class="fa-solid fa-chart-line me-2"></i> Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="transactions.html"><i class="fa-solid fa-list-check me-2"></i> Transactions</a></li>
                <li class="nav-item"><a class="nav-link" href="reports.html"><i class="fa-solid fa-file-invoice-dollar me-2"></i> Reports</a></li>
            </ul>
        </div>

        <!-- Main Body -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <h2 class="mb-4 fw-bold">Financial Dashboard</h2>
            
            <!-- Cards -->
            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <div class="card card-stat bg-success text-white p-3">
                        <h6>Total Income</h6>
                        <h4 id="lblIncome">₹0.00</h4>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card card-stat bg-danger text-white p-3">
                        <h6>Total Expenses</h6>
                        <h4 id="lblExpense">₹0.00</h4>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card card-stat bg-primary text-white p-3">
                        <h6>Current Balance</h6>
                        <h4 id="lblBalance">₹0.00</h4>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card card-stat bg-info text-white p-3">
                        <h6>Total Transactions</h6>
                        <h4 id="lblCount">0</h4>
                    </div>
                </div>
            </div>

            <!-- Charts -->
            <div class="row mb-4">
                <div class="col-md-6 mb-3">
                    <div class="card border-0 shadow-sm p-3">
                        <h5 class="fw-bold mb-3">Expense Breakdown</h5>
                        <canvas id="categoryChart" height="200"></canvas>
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <div class="card border-0 shadow-sm p-3">
                        <h5 class="fw-bold mb-3">Income vs Expense Ratio</h5>
                        <canvas id="ratioChart" height="200"></canvas>
                    </div>
                </div>
            </div>

            <!-- Recent Table -->
            <div class="card border-0 shadow-sm p-3">
                <h5 class="fw-bold mb-3">Recent Transactions</h5>
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                            <tr><th>Date</th><th>Type</th><th>Category</th><th>Description</th><th>Amount</th></tr>
                        </thead>
                        <tbody id="recentTxTable"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/charts.js"></script>
<script>
    checkAuth();
    const user = getCurrentUser();
    document.getElementById('welcomeUser').innerText = `Welcome, ${user.name}`;

    const summary = calculateSummary();
    document.getElementById('lblIncome').innerText = `₹${summary.income.toFixed(2)}`;
    document.getElementById('lblExpense').innerText = `₹${summary.expense.toFixed(2)}`;
    document.getElementById('lblBalance').innerText = `₹${summary.balance.toFixed(2)}`;
    document.getElementById('lblCount').innerText = summary.count;

    // Render Recent Table
    const txs = getUserTransactions().slice(-5).reverse();
    const tbody = document.getElementById('recentTxTable');
    if(txs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted">No transactions found.</td></tr>`;
    } else {
        tbody.innerHTML = txs.map(t => `
            <tr>
                <td>${t.date}</td>
                <td><span class="badge bg-${t.type === 'Income' ? 'success' : 'danger'}">${t.type}</span></td>
                <td>${t.categoryName}</td>
                <td>${t.description || '-'}</td>
                <td class="fw-bold ${t.type === 'Income' ? 'text-success' : 'text-danger'}">₹${t.amount.toFixed(2)}</td>
            </tr>
        `).join('');
    }

    renderDashboardCharts();
</script>
</body>
</html>
