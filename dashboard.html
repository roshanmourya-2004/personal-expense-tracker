<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="dashboard.html"><i class="fa-solid fa-wallet text-warning me-2"></i>ExpenseTracker</a>
        <div class="d-flex align-items-center">
            <span class="text-light me-3" id="welcomeUser"></span>
            <button onclick="logoutUser()" class="btn btn-outline-danger btn-sm">Logout</button>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar Navigation -->
        <div class="col-md-3 col-lg-2 sidebar collapse d-md-block p-0">
            <ul class="nav flex-column pt-3">
                <li class="nav-item"><a class="nav-link active" href="dashboard.html"><i class="fa-solid fa-chart-line me-2"></i> Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="transactions.html"><i class="fa-solid fa-list-check me-2"></i> Transactions</a></li>
                <li class="nav-item"><a class="nav-link" href="reports.html"><i class="fa-solid fa-file-invoice-dollar me-2"></i> Reports</a></li>
            </ul>
        </div>

        <!-- Main Body -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <h2 class="mb-4 fw-bold">Financial Dashboard</h2>
            
            <!-- Cards -->
            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <div class="card card-stat bg-success text-white p-3">
                        <h6>Total Income</h6>
                        <h4 id="lblIncome">₹0.00</h4>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card card-stat bg-danger text-white p-3">
                        <h6>Total Expenses</h6>
                        <h4 id="lblExpense">₹0.00</h4>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card card-stat bg-primary text-white p-3">
                        <h6>Current Balance</h6>
                        <h4 id="lblBalance">₹0.00</h4>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card card-stat bg-info text-white p-3">
                        <h6>Total Transactions</h6>
                        <h4 id="lblCount">0</h4>
                    </div>
                </div>
            </div>

            <!-- Charts -->
            <div class="row mb-4">
                <div class="col-md-6 mb-3">
                    <div class="card border-0 shadow-sm p-3">
                        <h5 class="fw-bold mb-3">Expense Breakdown</h5>
                        <canvas id="categoryChart" height="200"></canvas>
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <div class="card border-0 shadow-sm p-3">
                        <h5 class="fw-bold mb-3">Income vs Expense Ratio</h5>
                        <canvas id="ratioChart" height="200"></canvas>
                    </div>
                </div>
            </div>

            <!-- Recent Table -->
            <div class="card border-0 shadow-sm p-3">
                <h5 class="fw-bold mb-3">Recent Transactions</h5>
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                            <tr><th>Date</th><th>Type</th><th>Category</th><th>Description</th><th>Amount</th></tr>
                        </thead>
                        <tbody id="recentTxTable"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/charts.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script type="module">
    import { 
        auth, 
        db, 
        onAuthStateChanged, 
        signOut, 
        collection, 
        getDocs, 
        query, 
        where 
    } from "./js/firebase-config.js";

    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            window.location.href = 'login.html';
        } else {
            document.getElementById('welcomeUser').innerText = `Welcome, ${user.displayName || user.email}`;
            await loadDashboardData(user.uid);
        }
    });

    window.logoutUser = async function() {
        await signOut(auth);
        window.location.href = 'login.html';
    };

    async function loadDashboardData(uid) {
        const q = query(collection(db, "transactions"), where("userId", "==", uid));
        const snapshot = await getDocs(q);
        
        let totalIncome = 0;
        let totalExpense = 0;
        const catMap = {};
        const transactions = [];

        snapshot.forEach((docSnap) => {
            const data = docSnap.data();
            transactions.push(data);
            const amt = parseFloat(data.amount);
            if (data.type === 'Income') {
                totalIncome += amt;
            } else if (data.type === 'Expense') {
                totalExpense += amt;
                catMap[data.category] = (catMap[data.category] || 0) + amt;
            }
        });

        // Update metric cards
        document.getElementById('lblIncome').innerText = `₹${totalIncome.toFixed(2)}`;
        document.getElementById('lblExpense').innerText = `₹${totalExpense.toFixed(2)}`;
        document.getElementById('lblBalance').innerText = `₹${(totalIncome - totalExpense).toFixed(2)}`;
        document.getElementById('lblCount').innerText = transactions.length;

        // Render Recent Transactions (Last 5)
        transactions.sort((a, b) => new Date(b.date) - new Date(a.date));
        const recent = transactions.slice(0, 5);
        const tbody = document.getElementById('recentTxTable');
        
        if (recent.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted">No transactions recorded yet.</td></tr>`;
        } else {
            tbody.innerHTML = recent.map(t => `
                <tr>
                    <td>${t.date}</td>
                    <td><span class="badge bg-${t.type === 'Income' ? 'success' : 'danger'}">${t.type}</span></td>
                    <td>${t.category}</td>
                    <td>${t.description || '-'}</td>
                    <td class="fw-bold ${t.type === 'Income' ? 'text-success' : 'text-danger'}">₹${parseFloat(t.amount).toFixed(2)}</td>
                </tr>
            `).join('');
        }

        // Render Category Doughnut Chart
        const ctxCat = document.getElementById('categoryChart')?.getContext('2d');
        if (ctxCat) {
            new Chart(ctxCat, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(catMap),
                    datasets: [{
                        data: Object.values(catMap),
                        backgroundColor: ['#e74c3c', '#3498db', '#9b59b6', '#f1c40f', '#e67e22', '#1abc9c', '#34495e']
                    }]
                }
            });
        }

        // Render Ratio Bar Chart
        const ctxRatio = document.getElementById('ratioChart')?.getContext('2d');
        if (ctxRatio) {
            new Chart(ctxRatio, {
                type: 'bar',
                data: {
                    labels: ['Overview'],
                    datasets: [
                        { label: 'Income', data: [totalIncome], backgroundColor: '#2ecc71' },
                        { label: 'Expense', data: [totalExpense], backgroundColor: '#e74c3c' }
                    ]
                },
                options: { responsive: true, scales: { y: { beginAtZero: true } } }
            });
        }
    }
</script>
</body>
</html>
